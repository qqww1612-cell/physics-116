<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>بيانات الطالب — فيزياء المسارات</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <!-- مكتبة Supabase من CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ================= الترويسة ================= -->
  <header class="student-header">
    <div class="container">
      <div class="brand-student">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="6" fill="currentColor"/>
            <ellipse cx="32" cy="32" rx="26" ry="11" fill="none" stroke="currentColor" stroke-width="2.6"/>
            <ellipse cx="32" cy="32" rx="26" ry="11" fill="none" stroke="currentColor" stroke-width="2.6" transform="rotate(60 32 32)"/>
            <ellipse cx="32" cy="32" rx="26" ry="11" fill="none" stroke="currentColor" stroke-width="2.6" transform="rotate(120 32 32)"/>
          </svg>
        </div>
        <div class="brand-text">
          <h2>بيانات الطالب</h2>
          <p>نظام السجل الأكاديمي — فيزياء المسارات</p>
        </div>
      </div>

      <div class="user-greeting" id="greetingText">زائر</div>
      <div class="user-avatar" id="userAvatar">ز</div>
      <button class="btn-logout" id="btnLogout" style="display:none;">تسجيل الخروج</button>
    </div>
  </header>

  <div class="student-container">
    <!-- شريط المصادقة -->
    <div id="authBar" style="display:flex; gap:12px; margin-bottom:26px; flex-wrap:wrap;"></div>

    <!-- شريط الحالة -->
    <div class="status-bar">
      <div class="status-item">
        <span class="label">المعدل التراكمي</span>
        <span class="value highlight" id="gpaValue">—</span>
      </div>
      <div class="status-item">
        <span class="label">عدد المواد</span>
        <span class="value" id="subjectsCount">0</span>
      </div>
      <div class="status-item">
        <span class="label">الحالة</span>
        <span class="value" id="statusValue">—</span>
      </div>
    </div>

    <!-- بطاقة الملف الشخصي -->
    <div class="profile-card">
      <div class="profile-avatar-lg" id="profileAvatar">ز</div>
      <div class="profile-info">
        <h3 id="studentName">—</h3>
        <div class="email" id="studentEmail">—</div>
        <div class="field-row">
          <span class="field-key">رقم الطالب</span>
          <span class="field-value" id="studentId">—</span>
        </div>
        <div class="field-row">
          <span class="field-key">الصف الدراسي</span>
          <span class="field-value" id="studentGrade">—</span>
        </div>
        <div class="field-row">
          <span class="field-key">التخصص</span>
          <span class="field-value" id="studentMajor">—</span>
        </div>
        <button class="btn-edit" id="btnEditProfile">تعديل الملف الشخصي</button>
      </div>
    </div>

    <!-- بطاقة المواد -->
    <div class="data-section">
      <div class="section-header">
        <div class="section-icon" aria-hidden="true">📚</div>
        <div>
          <h3>المواد الدراسية</h3>
          <p>إدارة ومتابعة درجات موادك الأكاديمية</p>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">اسم المادة</label>
          <input type="text" id="subjectName" class="form-input" placeholder="مثال: فيزياء ٢">
        </div>
        <div class="form-group">
          <label class="form-label">كود المادة</label>
          <input type="text" id="subjectCode" class="form-input" placeholder="مثال: PHY201">
        </div>
        <div class="form-group">
          <label class="form-label">الدرجة</label>
          <input type="number" id="subjectGrade" class="form-input" min="0" max="100" placeholder="0-100">
        </div>
        <button class="btn-add-subject" id="btnAddSubject">إضافة مادة</button>
      </div>

      <div class="subjects-list" id="subjectsList">
        <!-- المواد تظهر هنا -->
      </div>
    </div>

    <!-- نافذة إضافة مادة -->
    <div class="modal hidden" id="addSubjectModal">
      <div class="modal-card">
        <button class="modal-close" id="closeModal">&times;</button>
        <h3 class="modal-title">إضافة مادة جديدة</h3>
        <div class="form-grid" style="grid-template-columns: 1fr;">
          <div class="form-group">
            <label class="form-label">اسم المادة</label>
            <input type="text" id="modalSubjectName" class="form-input" placeholder="مثال: فيزياء ٢">
          </div>
          <div class="form-group">
            <label class="form-label">كود المادة</label>
            <input type="text" id="modalSubjectCode" class="form-input" placeholder="مثال: PHY201">
          </div>
          <div class="form-group">
            <label class="form-label">الدرجة</label>
            <input type="number" id="modalSubjectGrade" class="form-input" min="0" max="100" placeholder="0-100">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-secondary" id="btnCancelSubject">إلغاء</button>
          <button class="btn-save" id="btnSaveSubject">إضافة المادة</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="student-footer">
    فيزياء المسارات — بياناتك محفوظة بشكل آمن في قاعدة بيانات Supabase
  </footer>

  <script>
    /* ================= إعداد Supabase ================= */
    const SUPABASE_URL = 'https://jbqotzkinlatewrjvadi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_F93GOC_LaWY-NWadmN8wmA_F0qEh_iO'; // ← الصق المفتاح من Supabase > Settings > API

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ================= حالة التطبيق ================= */
    let currentUser = null;

    const els = {
      greetingText: document.getElementById('greetingText'),
      userAvatar: document.getElementById('userAvatar'),
      btnLogout: document.getElementById('btnLogout'),
      authBar: document.getElementById('authBar'),
      studentName: document.getElementById('studentName'),
      studentEmail: document.getElementById('studentEmail'),
      studentId: document.getElementById('studentId'),
      studentGrade: document.getElementById('studentGrade'),
      studentMajor: document.getElementById('studentMajor'),
      profileAvatar: document.getElementById('profileAvatar'),
      gpaValue: document.getElementById('gpaValue'),
      subjectsCount: document.getElementById('subjectsCount'),
      statusValue: document.getElementById('statusValue'),
      subjectsList: document.getElementById('subjectsList'),
      subjectName: document.getElementById('subjectName'),
      subjectCode: document.getElementById('subjectCode'),
      subjectGrade: document.getElementById('subjectGrade'),
      btnAddSubject: document.getElementById('btnAddSubject'),
      modal: document.getElementById('addSubjectModal'),
      closeModal: document.getElementById('closeModal'),
      modalSubjectName: document.getElementById('modalSubjectName'),
      modalSubjectCode: document.getElementById('modalSubjectCode'),
      modalSubjectGrade: document.getElementById('modalSubjectGrade'),
      btnCancelSubject: document.getElementById('btnCancelSubject'),
      btnSaveSubject: document.getElementById('btnSaveSubject'),
      btnEditProfile: document.getElementById('btnEditProfile')
    };

    /* ================= دوال Supabase ================= */
    function renderAuthBar() {
      if (currentUser) {
        els.authBar.innerHTML = `
          <span style="font-family:var(--font-ui); font-size:0.9rem; color:var(--text-soft);">
            مسجل كـ: ${currentUser.email}
          </span>
          <button id="btnSignOut" style="background:var(--danger); color:#fff; border:none; padding:8px 16px; border-radius:8px; font-family:var(--font-ui); font-weight:600; cursor:pointer;">تسجيل الخروج</button>
        `;
        document.getElementById('btnSignOut').addEventListener('click', handleSignOut);
      } else {
        els.authBar.innerHTML = `
          <button id="btnSignIn" style="background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-family:var(--font-arabic); font-weight:700; cursor:pointer;">تسجيل الدخول</button>
          <button id="btnSignUp" style="background:var(--surface); border:1.5px solid var(--line); color:var(--text); padding:10px 20px; border-radius:8px; font-family:var(--font-arabic); font-weight:700; cursor:pointer;">إنشاء حساب</button>
        `;
        document.getElementById('btnSignIn').addEventListener('click', showLoginModal);
        document.getElementById('btnSignUp').addEventListener('click', showRegisterModal);
      }
    }

    async function handleSignIn(email, password) {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        showToast(error.message, 'error');
        return false;
      }
      currentUser = data.user;
      renderAuthBar();
      renderProfile();
      showToast('تم تسجيل الدخول بنجاح', 'success');
      return true;
    }

    async function handleSignUp(email, password, fullName) {
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { full_name: fullName } }
      });
      if (error) {
        showToast(error.message, 'error');
        return false;
      }
      showToast('تم إنشاء الحساب. يرجى التحقق من بريدك الإلكتروني', 'info');
      return true;
    }

    async function handleSignOut() {
      await supabase.auth.signOut();
      currentUser = null;
      renderAuthBar();
      clearProfile();
      showToast('تم تسجيل الخروج', 'info');
    }

    async function fetchNotes() {
      if (!currentUser) return [];
      const { data, error } = await supabase
        .from('student_notes')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });
      if (error) {
        showToast('فشل في جلب البيانات', 'error');
        return [];
      }
      return data || [];
    }

    async function addNote(subjectName, subjectCode, grade) {
      if (!currentUser) return false;
      const { error } = await supabase
        .from('student_notes')
        .insert([{ user_id: currentUser.id, subject_name: subjectName, subject_code: subjectCode, grade: parseInt(grade) }]);
      if (error) {
        showToast('فشل في إضافة المادة', 'error');
        return false;
      }
      return true;
    }

    async function deleteNote(id) {
      if (!currentUser) return false;
      const { error } = await supabase
        .from('student_notes')
        .delete()
        .eq('id', id)
        .eq('user_id', currentUser.id);
      if (error) {
        showToast('فشل في الحذف', 'error');
        return false;
      }
      return true;
    }

    async function updateProfile(updates) {
      if (!currentUser) return false;
      const { error } = await supabase
        .from('profiles')
        .upsert({ user_id: currentUser.id, ...updates });
      if (error) {
        return true;
      }
      return true;
    }

    /* ================= واجهة المستخدم ================= */
    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function getInitials(name) {
      if (!name) return 'ز';
      const parts = name.trim().split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      return parts[0][0].toUpperCase();
    }

    function renderProfile() {
      if (!currentUser) return;

      supabase
        .from('profiles')
        .select('*')
        .eq('user_id', currentUser.id)
        .single()
        .then(({ data, error }) => {
          const profile = data || {};
          els.studentName.textContent = profile.full_name || currentUser.email.split('@')[0] || '—';
          els.studentEmail.textContent = currentUser.email || '—';
          els.studentId.textContent = profile.student_id || '—';
          els.studentGrade.textContent = profile.grade_level || '—';
          els.studentMajor.textContent = profile.major || '—';
          els.greetingText.textContent = `مرحباً، ${profile.full_name || 'طالب'}`;
          els.userAvatar.textContent = getInitials(profile.full_name);
          els.profileAvatar.textContent = getInitials(profile.full_name);
        });

      fetchNotes().then(notes => {
        els.subjectsCount.textContent = notes.length;
        if (notes.length > 0) {
          const gpa = (notes.reduce((sum, n) => sum + (n.grade || 0), 0) / notes.length).toFixed(2);
          els.gpaValue.textContent = gpa;
          els.statusValue.textContent = gpa >= 85 ? 'ممتاز' : gpa >= 70 ? 'جيد جداً' : 'جيد';
        } else {
          els.gpaValue.textContent = '—';
          els.statusValue.textContent = 'لا توجد مواد';
        }
        renderSubjects(notes);
      });
    }

    function clearProfile() {
      els.studentName.textContent = '—';
      els.studentEmail.textContent = '—';
      els.studentId.textContent = '—';
      els.studentGrade.textContent = '—';
      els.studentMajor.textContent = '—';
      els.gpaValue.textContent = '—';
      els.subjectsCount.textContent = '0';
      els.statusValue.textContent = '—';
      els.subjectsList.innerHTML = '';
    }

    function renderSubjects(subjects) {
      els.subjectsList.innerHTML = '';
      if (subjects.length === 0) {
        els.subjectsList.innerHTML = '<div style="text-align:center; color:var(--text-soft); padding:30px;">لا توجد مواد مضافة بعد</div>';
        return;
      }
      subjects.forEach(s => {
        const item = document.createElement('div');
        item.className = 'subject-item';
        item.innerHTML = `
          <div class="subject-info">
            <div class="subject-name">${escapeHtml(s.subject_name)}</div>
            <div class="subject-code">${escapeHtml(s.subject_code || '—')}</div>
          </div>
          <div class="subject-grade">${s.grade}</div>
          <button class="btn-delete-note" data-id="${s.id}" style="background:none; border:none; color:var(--danger); cursor:pointer; margin-left:10px;">حذف</button>
        `;
        els.subjectsList.appendChild(item);
      });

      els.subjectsList.querySelectorAll('.btn-delete-note').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          if (confirm('هل أنت متأكد من حذف هذه المادة؟')) {
            const ok = await deleteNote(id);
            if (ok) renderProfile();
          }
        });
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function showLoginModal() {
      const html = `
        <div class="modal" id="authModal">
          <div class="modal-card" style="max-width:420px;">
            <button class="modal-close" id="closeAuthModal">&times;</button>
            <h3 class="modal-title">تسجيل الدخول</h3>
            <div class="form-grid" style="grid-template-columns: 1fr;">
              <div class="form-group">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" id="loginEmail" class="form-input" required placeholder="example@email.com">
              </div>
              <div class="form-group">
                <label class="form-label">كلمة المرور</label>
                <input type="password" id="loginPassword" class="form-input" required placeholder="كلمة المرور">
              </div>
            </div>
            <div class="form-actions">
              <button class="btn-secondary" id="closeAuthModalBtn">إلغاء</button>
              <button class="btn-save" id="doLogin">تسجيل الدخول</button>
            </div>
          </div>
        </div>`;
      document.body.insertAdjacentHTML('beforeend', html);
      document.getElementById('closeAuthModal').addEventListener('click', () => document.getElementById('authModal').remove());
      document.getElementById('closeAuthModalBtn').addEventListener('click', () => document.getElementById('authModal').remove());
      document.getElementById('doLogin').addEventListener('click', async () => {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        await handleSignIn(email, password);
        document.getElementById('authModal').remove();
      });
    }

    function showRegisterModal() {
      const html = `
        <div class="modal" id="authModal">
          <div class="modal-card" style="max-width:420px;">
            <button class="modal-close" id="closeAuthModal">&times;</button>
            <h3 class="modal-title">إنشاء حساب جديد</h3>
            <div class="form-grid" style="grid-template-columns: 1fr;">
              <div class="form-group">
                <label class="form-label">الاسم الكامل</label>
                <input type="text" id="regName" class="form-input" required placeholder="أحمد محمد">
              </div>
              <div class="form-group">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" id="regEmail" class="form-input" required placeholder="example@email.com">
              </div>
              <div class="form-group">
                <label class="form-label">كلمة المرور</label>
                <input type="password" id="regPassword" class="form-input" required minlength="6" placeholder="كلمة المرور">
              </div>
            </div>
            <div class="form-actions">
              <button class="btn-secondary" id="closeAuthModalBtn">إلغاء</button>
              <button class="btn-save" id="doRegister">إنشاء الحساب</button>
            </div>
          </div>
        </div>`;
      document.body.insertAdjacentHTML('beforeend', html);
      document.getElementById('closeAuthModal').addEventListener('click', () => document.getElementById('authModal').remove());
      document.getElementById('closeAuthModalBtn').addEventListener('click', () => document.getElementById('authModal').remove());
      document.getElementById('doRegister').addEventListener('click', async () => {
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        await handleSignUp(email, password, name);
        document.getElementById('authModal').remove();
      });
    }

    els.btnAddSubject.addEventListener('click', () => {
      els.modal.classList.remove('hidden');
      els.modalSubjectName.value = '';
      els.modalSubjectCode.value = '';
      els.modalSubjectGrade.value = '';
    });

    els.closeModal.addEventListener('click', () => els.modal.classList.add('hidden'));
    els.btnCancelSubject.addEventListener('click', () => els.modal.classList.add('hidden'));
    els.modal.addEventListener('click', (e) => { if (e.target === els.modal) els.modal.classList.add('hidden'); });

    els.btnSaveSubject.addEventListener('click', async () => {
      const name = els.modalSubjectName.value.trim();
      const code = els.modalSubjectCode.value.trim();
      const grade = els.modalSubjectGrade.value.trim();
      if (!name || !grade) {
        showToast('يرجى إدخال اسم المادة والدرجة', 'error');
        return;
      }
      const ok = await addNote(name, code, grade);
      if (ok) {
        renderProfile();
        els.modal.classList.add('hidden');
        showToast('تم إضافة المادة بنجاح', 'success');
      }
    });

    els.btnEditProfile.addEventListener('click', async () => {
      const name = prompt('أدخل الاسم الكامل:', els.studentName.textContent);
      if (name) {
        await updateProfile({ full_name: name, student_id: els.studentId.textContent, grade_level: els.studentGrade.textContent, major: els.studentMajor.textContent });
        renderProfile();
        showToast('تم تحديث الملف الشخصي', 'success');
      }
    });

    /* ================= بدء التشغيل ================= */
    renderAuthBar();
    supabase.auth.onAuthStateChange((event, session) => {
      if (session) {
        currentUser = session.user;
        renderAuthBar();
        renderProfile();
      } else {
        currentUser = null;
        renderAuthBar();
        clearProfile();
      }
    });
  </script>
</body>
</html>
